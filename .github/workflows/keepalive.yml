name: Keep backend awake

# Safety net on top of UptimeRobot: prevents the Render free plan from putting the server to sleep.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --max-time 60 "${{ vars.BACKEND_URL }}/api/v1/public/pay/online-available"
