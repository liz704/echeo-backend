spring:
  jackson:
    time-zone: Africa/Douala
    locale: fr_FR
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://ep-quiet-queen-aermj6cl-pooler.c-2.us-east-2.aws.neon.tech/neondb?sslmode=require}
    username: ${SPRING_DATASOURCE_USERNAME:neondb_owner}
    password: ${SPRING_DATASOURCE_PASSWORD:npg_ed1KnpSYW0Xo}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 300000
      max-lifetime: 540000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
